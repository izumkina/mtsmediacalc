<style>
:root{--ink:#1D2023;--muted:#626C77;--line:#E2E5EA;--bg:#F6F5F2;--red:#E4002B}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Onest',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#FCFBF9;border:1px solid var(--line);border-radius:20px;padding:36px 32px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.top img{width:52px;height:52px;object-fit:contain}
h1{font-family:'Unbounded',Arial,sans-serif;font-size:22px;line-height:1.15;margin:0}
.by{font-size:13px;color:var(--muted);margin-top:4px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:15px;background:#fff;color:var(--ink);margin-bottom:16px}
input:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
button{width:100%;height:48px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px}
button:disabled{opacity:.7;cursor:progress}
.err{min-height:20px;font-size:13px;color:#C4002A;margin-top:12px}
.lock{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
</style></head>

async function unlock(login,pass){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim()+':'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(S),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(I)},key,dec(C)));
}
