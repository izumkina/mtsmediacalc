<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="icom agency">
<title>Калькулятор 3.0 · BrandLiftLab МТС</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F4F2;--surface:#FFFFFF;--surface-2:#F7F7F5;--ink:#1D2023;--ink-2:#3C4146;--muted:#626C77;--faint:#8C949C;--line:#E3E5E8;--line-2:#D2D6DB;
  --red:#E4002B;--red-ink:#B8001F;--red-bg:#FDECEE;--up:#0E7A57;--dn:#B8001F;--bar:#2E3338;--bar-2:#B9BEC4;--sel:#1D2023;--on-sel:#FFFFFF;--shadow:0 12px 32px rgba(20,22,25,.14);
  --im:#1D2023;--te:#FF0032;--ks:#0070E5;--yo:#6C4DE6;--tk:#8D969F;--fm:#14A38B;--rt:#E09A2F;--a-foc:#E4002B;--a-oth:#0070E5;
  --f:'Golos Text',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141618;--surface:#1C1F22;--surface-2:#22262A;--ink:#ECEEF0;--ink-2:#C9CDD2;--muted:#9AA2AA;--faint:#77808A;--line:#2E3338;--line-2:#3A4046;
  --im:#E3E6EA;--tk:#7C858F;--a-foc:#FF3355;--a-oth:#4DA3FF;--red:#FF3355;--red-ink:#FF6B82;--red-bg:#3A1A20;--up:#4CC79A;--dn:#FF6B82;--bar:#D5D9DD;--bar-2:#5A6168;--sel:#ECEEF0;--on-sel:#141618;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141618;--surface:#1C1F22;--surface-2:#22262A;--ink:#ECEEF0;--ink-2:#C9CDD2;--muted:#9AA2AA;--faint:#77808A;--line:#2E3338;--line-2:#3A4046;
  --im:#E3E6EA;--tk:#7C858F;--a-foc:#FF3355;--a-oth:#4DA3FF;--red:#FF3355;--red-ink:#FF6B82;--red-bg:#3A1A20;--up:#4CC79A;--dn:#FF6B82;--bar:#D5D9DD;--bar-2:#5A6168;--sel:#ECEEF0;--on-sel:#141618;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top .in{max-width:1480px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:32px;height:32px}
.brand b{display:block;font-weight:700;font-size:15px;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;height:100%}
.nav button{border:0;background:none;padding:0 14px;height:100%;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--red)}
.nav .cnt{font-size:12px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.nav button.on .cnt{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.seg.full{display:flex}.seg.full button{flex:1}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.wide{width:100%;justify-content:center;min-height:44px;font-size:14px}
.btn svg{width:16px;height:16px;flex:none}
/* раскладка */
.wrap{max-width:1480px;margin:0 auto;padding:20px 24px 48px}
.view[hidden]{display:none}
.plan{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.step{padding:12px 14px}
.step h3{margin:0 0 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:8px}
.step h3 i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.opts.g2 .opt{min-height:52px;justify-content:center}
.perms{display:flex;flex-direction:column;gap:8px}
.runbar{position:sticky;bottom:12px;z-index:3}
.runbar .btn{box-shadow:0 6px 18px rgba(228,0,43,.22)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;text-align:left;display:flex;flex-direction:column;gap:6px}
.opt:hover{border-color:var(--line-2)}
.opt b{font-weight:600;font-size:13.5px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--red);color:var(--red-ink);background:var(--red-bg)}
.sub{font-size:12px;color:var(--muted)}
.klist{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kr .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kr b{font-weight:600}
.kr .kb{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);position:relative;overflow:hidden}
.kr .kb i{position:absolute;inset:0 auto 0 0;background:var(--a-oth);border-radius:2px}
.rules summary{cursor:pointer;padding:12px 16px;font-weight:500;font-size:13px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
.rules summary::after{content:"+";font-weight:600}
.rules[open] summary::after{content:"–"}
.rules .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.fld input[type=number],.fld select{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--ink)}
.fld.row{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.fld.row input[type=number]{width:84px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.chk input{width:16px;height:16px;accent-color:var(--ink)}
/* основная часть */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead h1{margin:0;font-size:20px;font-weight:600;line-height:1.25;flex:1 1 360px;text-wrap:balance}
.phead .st{font-size:12px;color:var(--muted)}
.msg{border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.msg.err{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.msg[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpis.k1{grid-template-columns:minmax(0,1fr)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative}
.kpi.goal{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.kpi .l em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:0 7px}
.kpi .v{display:flex;align-items:baseline;gap:10px}
.kpi .v b{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1}
.kpi .v small{font-size:13px;color:var(--muted)}
.d{font-size:12.5px;font-weight:600}.d.up{color:var(--up)}.d.dn{color:var(--dn)}.d.eq{color:var(--faint)}
.bul{position:relative;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.bul i{position:absolute;left:0;top:-1px;bottom:-1px;border-radius:3px;background:var(--bar)}
.bul s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red)}
.kpi .f{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
/* шкала плана */
.tl{padding:14px 16px 10px}
.tlh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:12px}
.tlh h2,.sec h2{margin:0;font-size:15px;font-weight:600}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--bar-2)}
.leg i.ch{background:var(--surface);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.leg i.fx{background:var(--tk) repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 3px,transparent 3px 6px)}
.leg i.fam{width:auto;height:auto;background:none;margin:0}
.leg .sw{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:6px}.leg .sw b{width:8px;height:12px;border-radius:2px;display:inline-block}
.grid{display:grid;grid-template-columns:170px repeat(12,minmax(0,1fr));align-items:center}
.grid .mh{font-size:11.5px;color:var(--faint);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line)}
.grid .rl{font-size:12.5px;color:var(--ink-2);padding:0 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:34px;line-height:34px;border-bottom:1px solid var(--line)}
.grid .cl{height:34px;border-bottom:1px solid var(--line);border-left:1px dashed var(--line);position:relative}
.track{position:relative;height:34px;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/12) 100%}
.bar{position:absolute;top:5px;height:24px;border-radius:6px;background:var(--tk);border:0;color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;overflow:hidden;z-index:2}
.bar:hover{box-shadow:0 0 0 2px var(--ink)}
.fam-im{background:var(--im);color:var(--surface)}.fam-te{background:var(--te)}.fam-ks{background:var(--ks)}.fam-yo{background:var(--yo)}.fam-tk{background:var(--tk)}.fam-fm{background:var(--fm)}.fam-rt{background:var(--rt);color:#1D2023}
.bar.fx{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.26) 0 5px,transparent 5px 10px)}
.bar.ch{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.bar.cf{outline:2px dashed var(--dn);outline-offset:2px}
.bar .nm{font-weight:500;opacity:.92;overflow:hidden;text-overflow:ellipsis}
.bar svg{width:12px;height:12px}
/* вкладки деталей */
.sec{padding:14px 16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-2px -16px 12px;padding:0 12px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.r{display:grid;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.r.h{font-size:11.5px;color:var(--faint);font-weight:500;padding-top:0}
.r:last-child{border-bottom:0}
.ra{grid-template-columns:28px minmax(0,2.2fr) minmax(160px,1.6fr) 90px 150px}
.hb{display:flex;align-items:center;gap:8px}
.hb .t{flex:1;height:8px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
.hb .t i{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:4px}
.hb.ac .t i{background:var(--a-oth)}.hb.ac.fo .t i{background:var(--a-foc)}
.hb b{min-width:48px;text-align:right;font-weight:600}
.rc{grid-template-columns:minmax(0,2fr) 90px repeat(2,minmax(110px,1fr))}
.rp{grid-template-columns:minmax(0,2fr) 70px 110px 90px 130px}
.more{margin-top:10px}
.heat{display:grid;grid-template-columns:170px repeat(12,minmax(0,1fr));gap:2px;font-size:11.5px}
.heat .hc{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:600}
.heat .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);display:flex;align-items:center;padding-right:8px}
.heat .hm{color:var(--faint);text-align:center}
.heat .hc.u{box-shadow:inset 0 0 0 2px var(--red)}
/* сравнение */
.cmpbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cmpbar .sp{flex:1}
.cmpbar label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.cmpbar select{height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface)}
.cmpw{overflow-x:auto;padding-bottom:6px}
.cmpg{display:grid;gap:12px;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr)}
.col{display:flex;flex-direction:column}
.col.base{background:var(--surface-2)}
.col.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ch1{padding:14px 16px 12px;border-bottom:1px solid var(--line);min-height:92px;display:flex;flex-direction:column;gap:6px}
.ch1 b{font-weight:600;font-size:14px;line-height:1.3}
.ch1 .meta{font-size:12px;color:var(--muted)}
.cm{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cm .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cm .v{display:flex;align-items:baseline;gap:8px}
.cm .v b{font-size:20px;font-weight:600}
.atr{display:grid;grid-template-columns:30px minmax(0,2.2fr) 96px repeat(3,minmax(120px,1fr));gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.atr.i{grid-template-columns:30px minmax(0,2.2fr) 96px repeat(2,minmax(140px,1fr))}
.atr.h{font-size:11.5px;color:var(--faint);font-weight:500;position:sticky;top:60px;background:var(--surface);z-index:2}
.atr .rk{font-size:11px;color:var(--faint);margin-left:6px}
.atr .tc{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);justify-self:start;color:var(--ink-2)}
.atr .tc.own{border-color:var(--red);color:var(--red-ink);background:var(--red-bg)}
.atr .tc.free{color:var(--faint);border-style:dashed}
.atr .hb{min-width:0}
.tchip{font-style:normal;font-size:11px;font-weight:600;border:1px solid var(--line-2);border-radius:999px;padding:0 7px;margin-left:6px;color:var(--muted);white-space:nowrap}
.tchip.own{border-color:var(--red);color:var(--red-ink);background:var(--red-bg)}
.cm .fb{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.cm .best{font-size:11px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:0 6px;color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.mini i{height:14px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--bar-2)}
.mini i.ch{background:var(--bar)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;color:var(--faint);text-align:center;margin-top:2px}
.ctop{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ctop span{display:flex;justify-content:space-between;gap:8px}
.cact{padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:520px}
.empty .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
/* прогноз */
.fc{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.fcin{padding:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.fcin h2{margin:0;font-size:15px;font-weight:600}
.fld input[type=text]{height:38px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--ink)}
.fch{margin:0 0 2px;font-size:20px;font-weight:600;line-height:1.25}
.yr{font-size:11.5px;font-weight:600;color:var(--faint);margin:2px 0 -1px}
.hint{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.fcact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rf{grid-template-columns:minmax(0,2fr) minmax(160px,1.5fr) 110px 170px}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;accent-color:var(--ink)}
.rng input[type=number]{width:86px;height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;background:var(--surface)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.pick button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chart{padding:14px 16px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{font-size:11px;fill:var(--faint)}
.chart .bv{fill:var(--bar)}
.chart .bv.nx{fill:var(--bar-2)}
.chart .fl{fill:var(--red);opacity:.85}
.chart .gl{stroke:var(--line);stroke-width:1}
/* боковая панель */
.dw{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(20,22,25,.32)}
.dw[hidden]{display:none}
.dwp{width:min(780px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dwh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dwh h2{margin:0;font-size:17px;font-weight:600;flex:1;line-height:1.3}
.dwb{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dwf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dwb h3{margin:0 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.tri{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
.tri button{border:0;background:var(--surface);padding:4px 9px;font-size:12px;color:var(--muted)}
.tri button+button{border-left:1px solid var(--line-2)}
.tri button.on{background:var(--ink);color:var(--surface)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.dwb .ra{grid-template-columns:24px minmax(0,1.7fr) minmax(150px,1.2fr) 80px}
.dwb .ra>:nth-child(5){display:none}
.dwb .rc{grid-template-columns:minmax(0,1.6fr) 70px repeat(2,minmax(100px,1fr))}
.dwb .heat{grid-template-columns:130px repeat(12,minmax(0,1fr))}
.ct{display:grid;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ct.i{grid-template-columns:26px minmax(0,1.9fr) minmax(170px,1.2fr) 30px}
.ct.k{grid-template-columns:26px minmax(0,1.7fr) 70px 110px minmax(150px,1fr)}
.th{border:0;background:none;padding:0;font:inherit;font-size:11.5px;color:var(--faint);text-align:left;cursor:pointer}
.th:hover{color:var(--ink)}.th.on{color:var(--ink);font-weight:600}
.ct.h{font-size:11.5px;color:var(--faint);font-weight:500}
.ct:not(.on):not(.h){color:var(--muted)}
.ct .chk{min-width:0}.ct .chk input{flex:none}.ct .chk span{overflow:hidden;text-overflow:ellipsis}
.ct small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.ct b{font-weight:600}
.star{border:0;background:none;font-size:18px;line-height:1;color:var(--faint);padding:2px;border-radius:6px}
.star.on{color:var(--red)}
.star:hover{color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
@media (max-width:1100px){.plan,.fc{grid-template-columns:1fr}.rail,.fcin{position:static}.kpis{grid-template-columns:1fr}.top .in{gap:14px}.brand span{display:none}}
@media (max-width:720px){.top .in{height:auto;flex-wrap:wrap;padding:8px 12px;gap:6px 10px}.nav{order:3;width:100%;height:42px;overflow-x:auto}.nav button{padding:0 8px;font-size:13px;flex:none}.tright .btn.ghost{padding:6px 8px}.wrap{padding:12px 12px 40px}.cmpw{margin:0 -12px;padding:0 12px 6px}.kpi .v b{font-size:26px}.phead h1{flex-basis:100%}.tl,.sec,.chart{overflow-x:auto}.seg.full button{padding:6px 4px;font-size:12.5px}.pick button{padding:4px 8px}.main{min-width:0}.fcin{min-width:0}.grid,.heat{grid-template-columns:110px repeat(12,minmax(0,1fr))}.ra{grid-template-columns:24px minmax(0,1fr) 120px}.ra>:nth-child(4),.ra>:nth-child(5){display:none}}
@media (prefers-reduced-motion:no-preference){.btn,.opt,.bar,.nav button{transition:background-color .15s,border-color .15s,box-shadow .15s,color .15s}}

 2:{t:'Максимум предпочтения',d:'на заданный бюджет'},3:{t:'Бюджет под цель по атрибутам',d:'минимальный бюджет и сплит по продуктам'},

  if(d.addgo){ const key=$('#adK').value, m=+$('#adM').value, len=+$('#adL').value, st=Math.min(m,12-len), std=D.cost[key].ots;
    state.flights.push({id:'u'+Date.now(),start:st,vols:new Array(len).fill(Math.round(std/len)),fixed:false,baseKey:key,key,mult:1,complex:true,user:true}); markManual(); closeDw();
    state.msg={k:'ok',t:`Слот добавлен: ${T[key].label}`}; renderAll(); return; }
  if(d.fcm!=null){ state.fc.start=+d.fcm; renderFc(); return; }
  if(d.fclen){ state.fc.len=parseFloat(d.fclen); renderFc(); return; }
  if(d.fccx!=null){ state.fc.complex=d.fccx==='1'; renderFc(); return; }
  if(d.fca){ const a=d.fca, s=state.fc; s.attrs=s.attrs.includes(a)?s.attrs.filter(x=>x!==a):[...s.attrs,a]; renderFc(); return; }
  if(d.fcall){ state.fc.allA=!state.fc.allA; renderFc(); return; }
  if(d.fct){ state.fc.tab=d.fct; renderFc(); return; }
  if(d.fcadd){ const f=fcFlight(); if(!f.vols.length) return; const part=f.vols.reduce((a,b)=>a+b,0)<state.fc.ots-1; state.flights.push(f); markManual(); state.view='plan'; state.msg={k:'ok',t:`Добавлено в план: «${f.name||T[f.key].label}»${part?', месяцы 2027 года':''}`}; renderAll(); window.scrollTo({top:0}); return; }
  if(d.fcsave){ const f=fcFlight(); if(!f.vols.length) return; const _f=f, fl=[...clone(state.flights),f], nm=`${planLabel()} + ${f.name?`«${f.name}»`:`${T[f.key].label}, ${period(f)}`}`; const ok=savePlan(nm,fl,{...metaNow(),src:{kind:'manual',from:clone(state.planSrc)}}); state.msg={k:'ok',t:ok?'Добавлено в сравнение':'Уже в сравнении'}; renderAll(); return; }
});
document.addEventListener('change',e=>{ const t=e.target, d=t.dataset;
  if(t.id==='inMaxN'){ state.maxN=Math.min(11,Math.max(1,+t.value||3)); return; }
  if(t.id==='pCorr'){ state.corr=t.checked?20:0; renderRail(); return; }
  if(t.id==='pSimple'){ state.allowSimple=t.checked; return; }
  if(t.id==='pDrop'){ state.keepMix=!t.checked; return; }
  if(t.id==='pTerr'){ state.useTerr=t.checked; return; }
  if(t.id==='inCorr'){ state.corr=Math.min(100,Math.max(0,+t.value||0)); initDefaults(); renderAll(); return; }
  if(t.id==='inBudget'){ state.budget=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0)*1e9; return; }
  if(t.id==='inRet'){ state.ret=Math.min(0.98,Math.max(0,+t.value||0.85)); initDefaults(); renderAll(); return; }
  if(t.id==='inCal'){ state.calib=Math.max(0.01,+t.value||1.18); initDefaults(); renderAll(); return; }
  if(t.id==='inKcx'){ state.kcx=Math.min(1,Math.max(0,+t.value||0.75)); initDefaults(); renderAll(); return; }
  if(t.id==='inCpt'){ const old=state.cpt; state.cpt=Math.max(1,+t.value||216); state.budget*=state.cpt/old; S0L=null; initDefaults(); renderAll(); return; }
  if(t.id==='fcKey'){ state.fc.key=t.value; state.fc.ots=D.cost[t.value].ots; state.fc.attrs=fcDefaultAttrs(t.value); renderFc(); return; }
  if(t.id==='fcOts'||t.id==='fcOtsR'){ state.fc.ots=Math.max(0.1,parseFloat(String(t.value).replace(',','.'))||0.1)*1e6; renderFc(); return; }
  if(d.ka){ const a=d.ka; state.kpiCustom.attrs=t.checked?[...new Set([...state.kpiCustom.attrs,a])]:state.kpiCustom.attrs.filter(x=>x!==a); refresh(); return; }
  if(d.ca){ state.custom.w[d.ca]=t.checked?1:0; S0L=null; initDefaults(); renderAll(); return; }
  if(d.cf!=null){ const fl=state.flights[+d.cf]; if(fl){ fl.pin=!t.checked; if(fl.pin) fl.key=fl.baseKey; } renderAll(); return; }
  if(d.sname!=null){ renderAll(); return; }
  if(d.sk!=null){ const fl=state.flights[+d.sk]; fl.key=t.value; markManual(); renderAll(); return; }
  if(d.sp!=null){ const fl=state.flights[+d.sp]; fl.mult=Math.max(0,(+t.value||0)/100); markManual(); renderAll(); return; }
  if(d.spin!=null){ const fl=state.flights[+d.spin]; fl.pin=t.checked; renderAll(); return; }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.id==='fcName'){ state.fc.name=t.value; const h=document.querySelector('#v-fc .fch'); if(h){ const s=state.fc; h.textContent=t.value.trim()||`${T[s.key].label}, ${MGEN[s.start]}${s.len>1?'–'+MGEN[s.start+s.len-1]:''}`; } return; }
  if(t.dataset&&t.dataset.sname!=null){ const fl=state.flights[+t.dataset.sname]; if(fl) fl.name=t.value.trim()||null; return; }
  if(t.id==='fcOtsR'){ const n=$('#fcOts'); if(n) n.value=(+t.value).toFixed(1); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&DW) closeDw(); });

state.saved=loadSaved();
initDefaults();
renderAll();
</script>
</body>
</html>
