<style>:root{--ink:#1D2023;--muted:#626C77;--line:#E2E5EA;--bg:#F6F5F2;--red:#E4002B}*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Onest',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#FCFBF9;border:1px solid var(--line);border-radius:20px;padding:36px 32px}.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}

button:disabled{opacity:.7;cursor:progress}.err{min-height:20px;font-size:13px;color:#C4002A;margin-top:12px}.lock{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:16px}</style></head>
